[package]
name = "copilot-terminal-restore"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "Resume enrolled Copilot CLI conversations in restored Windows Terminal tabs"
license = "MIT"
publish = false

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
